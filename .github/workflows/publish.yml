name: Publish to npm

# Publishes the server package to npmjs.com whenever you cut a GitHub Release.
# Uses npm "trusted publishing" (OIDC) — no NPM_TOKEN secret required. The trust
# is configured on npmjs.com under the package's Trusted Publisher settings and
# must reference THIS file (publish.yml) in this repo.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing / provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; setup-node ships an older npm.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Publish
        run: npm publish
