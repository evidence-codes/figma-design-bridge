<!--
  This iframe exists for one reason: the plugin's main thread is a sandbox
  with no network access. It cannot open a socket. This can. Everything
  here is a relay — no Figma API calls, no logic.

  The port must match the bridge server. Default is 3055; if you started the
  server with FIGMA_BRIDGE_PORT set, type the same value in the field below.
-->
<style>
  :root {
    --ink: #14201C; --muted: #6B756F; --line: #EAE8E0;
    --on: #1F9E75; --err: #E24B4A; --idle: #B4B2A9;
  }
  * { box-sizing: border-box; }
  body {
    font: 13px/1.5 "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0; padding: 16px; color: var(--ink); background: #fff;
    -webkit-font-smoothing: antialiased;
  }
  .head { display: flex; align-items: center; gap: 10px; }
  .mark { width: 30px; height: 30px; border-radius: 8px; flex: none; display: block; }
  .name { font-weight: 600; font-size: 14px; letter-spacing: -0.1px; }
  .sub { color: var(--muted); font-size: 11px; margin-top: 1px; }

  .status {
    display: flex; align-items: center; gap: 8px;
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none;
    box-shadow: 0 0 0 0 rgba(31,158,117,0.45); }
  .dot.on { background: var(--on); animation: pulse 2s infinite; }
  .dot.err { background: var(--err); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(31,158,117,0.45); }
    70% { box-shadow: 0 0 0 6px rgba(31,158,117,0); }
    100% { box-shadow: 0 0 0 0 rgba(31,158,117,0); }
  }
  #msg { color: var(--muted); }
  #msg b { color: var(--ink); font-weight: 500; }
  code { font-family: ui-monospace, monospace; font-size: 11px; }

  .port {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 14px; color: var(--muted); font-size: 11px;
  }
  .port input {
    width: 60px; font: 11px ui-monospace, monospace; padding: 3px 6px;
    border: 1px solid var(--line); border-radius: 6px; color: var(--ink);
    text-align: right; outline: none;
  }
  .port input:focus { border-color: var(--on); }
</style>

<div class="head">
  <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="t" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#25B98A"/><stop offset="1" stop-color="#1B7D5D"/>
      </linearGradient>
    </defs>
    <rect width="512" height="512" rx="116" fill="url(#t)"/>
    <g stroke="#fff" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <g stroke-width="10" opacity="0.92">
        <path d="M218 208 V330"/><path d="M256 219 V330"/><path d="M294 208 V330"/>
      </g>
      <path d="M96 332 L180 176 Q256 262 332 176 L416 332" stroke-width="18"/>
      <path d="M180 176 V342" stroke-width="22"/><path d="M332 176 V342" stroke-width="22"/>
      <path d="M96 340 H416" stroke-width="26"/>
    </g>
  </svg>
  <div>
    <div class="name">Design Bridge</div>
    <div class="sub">Figma ↔ your agent</div>
  </div>
</div>

<div class="status">
  <span class="dot" id="dot"></span>
  <span id="msg">Connecting…</span>
</div>

<div class="port">
  <span>Bridge port</span>
  <input id="port" type="number" min="1" max="65535" />
</div>

<script>
  var DEFAULT_PORT = 3055;
  var ws, retry = 0, timer;

  // Figma's plugin iframe can run at a null origin where localStorage throws.
  // Guard it so a storage failure never aborts the connect logic.
  function loadPort() {
    try { return localStorage.getItem("bridgePort"); } catch (e) { return null; }
  }
  function savePort(v) {
    try { localStorage.setItem("bridgePort", v); } catch (e) {}
  }

  var portInput = document.getElementById("port");
  portInput.value = loadPort() || DEFAULT_PORT;

  function setState(cls, text) {
    document.getElementById("dot").className = "dot " + cls;
    document.getElementById("msg").innerHTML = text;
  }

  function connect() {
    if (timer) clearTimeout(timer);
    if (ws) { try { ws.close(); } catch (e) {} }

    var port = portInput.value || DEFAULT_PORT;
    savePort(port);
    ws = new WebSocket("ws://127.0.0.1:" + port);

    ws.onopen = function () {
      retry = 0;
      setState("on", "<b>Connected.</b> Leave this open while you work.");
    };

    // Server -> plugin sandbox
    ws.onmessage = function (e) {
      parent.postMessage({ pluginMessage: JSON.parse(e.data) }, "*");
    };

    ws.onclose = function () {
      var wait = Math.min(1000 * Math.pow(2, retry++), 15000);
      setState("", "Disconnected. Retrying in " + Math.round(wait / 1000) + "s…");
      timer = setTimeout(connect, wait);
    };

    ws.onerror = function () {
      setState("err", "Can't reach the bridge on port " + port +
        ". Is the server running?");
    };
  }

  // Reconnect immediately when the port is changed.
  portInput.onchange = function () { retry = 0; connect(); };

  // Plugin sandbox -> server
  onmessage = function (event) {
    var msg = event.data.pluginMessage;
    if (msg && ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
  };

  connect();
</script>
